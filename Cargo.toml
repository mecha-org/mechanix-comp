[package]
name = "compositor"
version = "1.0.0"
edition = "2024"

[workspace]
members = ["."]

[dependencies.smithay]
git = "https://github.com/mecha-org/smithay"
rev = "69e3fa5a6b95ef73eca5fe43ae8bfdaebfb5135b"
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_udev",
  "backend_session_libseat",
  "backend_libinput",
  "renderer_gl",
  "desktop",
  "wayland_frontend",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/mecha-org/smithay"
rev = "69e3fa5a6b95ef73eca5fe43ae8bfdaebfb5135b"
default-features = false

[dependencies]
bitflags = "2.13.0"
mxconfig = { git = "https://github.com/mecha-org/mxconfig", rev = "510a018ef9e0a174fecac7cedb5369231a494e30" }
sd-notify = "0.5.0"
thiserror = "2.0.20"
tracing = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Not named in src: the phosh_private code wayland-scanner generates refers
# to `wayland_backend::` paths.
wayland-backend = "0.3.16"
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
xcursor = "0.3.11"
