[package]
name = "compositor"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]

[features]
default = ["session"]
# Clipboard, lock, foreign-toplevel, IME, vkbd, idle, output-power, activation,
# and the udev/winit output backends.
session = []

[dependencies.smithay]
git = "https://github.com/mecha-org/smithay"
rev = "60aafc2b1a64395bd32ec93f41e6712a07544c34"
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_udev",
  "backend_session_libseat",
  "backend_libinput",
  "renderer_gl",
  "desktop",
  "wayland_frontend",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/mecha-org/smithay"
rev = "60aafc2b1a64395bd32ec93f41e6712a07544c34"
default-features = false

[dependencies]
thiserror = "2.0.20"
tracing = "0.1"
xcursor = "0.3.11"
